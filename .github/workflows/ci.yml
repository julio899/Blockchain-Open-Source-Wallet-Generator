name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests (vectores EIP-55, BIP-39, BIP-44, keystore, archivos)
        run: npm test

      - name: Auditoría de dependencias
        run: npm audit --omit=dev

      - name: Construir bundle web
        run: npm run build:web

      - name: Verificar que el bundle no accede a red ni a APIs de Node
        run: node scripts/verify-bundle.js
